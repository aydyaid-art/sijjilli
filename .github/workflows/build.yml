name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - run: npx cap add android
      
      - run: npx cap sync android
      - run: echo "===MANIFEST===" && cat android/app/src/main/AndroidManifest.xml

      - run: echo "===GRADLE===" && cat android/app/build.gradle

      - run: echo "===MAINACTIVITY===" && find android/app/src/main/java -name "MainActivity.java" -exec cat {} \;

      - uses: android-actions/setup-android@v3
      - run: |
          mkdir -p android/app/src/main/java/com/aydyaidart/sijjilli
          cat > android/app/src/main/java/com/aydyaidart/sijjilli/MainActivity.java << 'EOF'
          package com.aydyaidart.sijjilli;
          import android.os.Bundle;
          import android.content.ContentValues;
          import android.provider.MediaStore;
          import android.net.Uri;
          import com.getcapacitor.BridgeActivity;
          import java.io.OutputStream;
          import java.io.PrintWriter;
          import java.io.StringWriter;
          public class MainActivity extends BridgeActivity {
              private void saveCrashLog(String content) {
                  try {
                      ContentValues values = new ContentValues();
                      values.put(MediaStore.Downloads.DISPLAY_NAME, "crash_log.txt");
                      values.put(MediaStore.Downloads.MIME_TYPE, "text/plain");
                      values.put(MediaStore.Downloads.IS_PENDING, 1);
                      Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                      if (uri != null) {
                          OutputStream os = getContentResolver().openOutputStream(uri);
                          os.write(content.getBytes());
                          os.close();
                          values.clear();
                          values.put(MediaStore.Downloads.IS_PENDING, 0);
                          getContentResolver().update(uri, values, null, null);
                      }
                  } catch (Exception e) {}
              }
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  Thread.setDefaultUncaughtExceptionHandler((thread, throwable) -> {
                      StringWriter sw = new StringWriter();
                      throwable.printStackTrace(new PrintWriter(sw));
                      saveCrashLog(sw.toString());
                      System.exit(1);
                  });
                  try {
                      super.onCreate(savedInstanceState);
                  } catch (Throwable t) {
                      StringWriter sw = new StringWriter();
                      t.printStackTrace(new PrintWriter(sw));
                      saveCrashLog(sw.toString());
                  }
              }
          }
          EOF

      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: sijjilli-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
